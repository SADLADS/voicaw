apply plugin: 'com.android.application'

// The version: VOICAW_VERSION (X.Y.Z, set by build-android.sh from the update site's latest),
// else this package's own for a local build. versionCode, which Android compares for updates,
// is X*10000 + Y*100 + Z, so Y and Z stay under 100.
def voicawVersion = System.getenv('VOICAW_VERSION') ?: new groovy.json.JsonSlurper().parse(file('../../package.json')).version
def versionParts = voicawVersion.tokenize('.').collect { it as int }
if (versionParts.size() != 3 || versionParts[1] > 99 || versionParts[2] > 99) {
    throw new GradleException("Bad version ${voicawVersion}: X.Y.Z with Y and Z under 100")
}

android {
    namespace = "com.voicaw.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.voicaw.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode versionParts[0] * 10000 + versionParts[1] * 100 + versionParts[2]
        versionName voicawVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    // Two builds of the same app: `direct`, the APK on updates.voicaw.com, which updates itself
    // from there (src/direct: AppUpdater and the permission to install packages), and `play`,
    // for Google Play, which may not update itself any other way than through Play (src/play:
    // an AppUpdater that never does). Both are signed with the same key, so one can replace
    // the other without losing the app's storage.
    flavorDimensions = ['store']
    productFlavors {
        direct {
            dimension 'store'
            // Where releases.json and the APKs are (updates/publish-android.mjs).
            buildConfigField 'String', 'UPDATE_URL', "\"${System.getenv('VOICAW_UPDATE_URL') ?: 'https://updates.voicaw.com/android/'}\""
        }
        play {
            dimension 'store'
        }
    }
    // The release key (mobile/make-release-key.sh), from VOICAW_KEYSTORE and its password in
    // VOICAW_KEYSTORE_PASSWORD (mobile/dist-android.sh mounts and reads them). Without them a
    // release build fails rather than ship unsigned.
    signingConfigs {
        release {
            if (System.getenv('VOICAW_KEYSTORE')) {
                storeFile file(System.getenv('VOICAW_KEYSTORE'))
                storeType 'pkcs12'
                storePassword System.getenv('VOICAW_KEYSTORE_PASSWORD')
                keyAlias 'voicaw'
                keyPassword System.getenv('VOICAW_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Notifications while the app is closed (FCM; needs google-services.json, see docs) and the
    // hidden page that words them (WebViewAssetLoader).
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
