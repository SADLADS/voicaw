<!DOCTYPE html>
<html lang="en-GB">

<head>
  <meta charset="UTF-8" />
  <script>
    // The theme before anything is drawn, so a light page never flashes dark (utils/theme.js).
    (function () {
      var t = 'dark';
      try {
        var v = localStorage.getItem('theme');
        if (v === 'light' || v === 'familiar' || v === 'halloween') t = v;
        else if (v === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches) t = 'light';
      } catch (e) { /* dark, then */ }
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.setAttribute('data-bs-theme', t === 'light' ? 'light' : 'dark');
    })();
  </script>
  <title>Voicaw</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="manifest" href="/manifest.json" />
  <!-- iOS Home Screen app (iOS ignores the manifest icons) -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Voicaw" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#6a52c9" />
  <!-- viewport-fit=cover: draw edge to edge so env(safe-area-inset-*) reports the notch, rounded
    corners and home indicator (they read 0 without it); the CSS pads for them.
    interactive-widget=resizes-content: Android Chrome shrinks the page for the on-screen
    keyboard (by default it lays the keyboard over the page and slides it up instead, which
    can leave the message box behind the keyboard). iOS ignores it: see utils/keyboardViewport.js. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
