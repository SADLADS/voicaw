<!DOCTYPE html>
<!-- The splash window (splash.js): the bird in a ring that spins while it waits and fills while
     an update downloads, and a line saying what's happening. Colours are the app's dark theme
     (client voicaw.css); the window has nothing but splashPreload.js. -->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Voicaw</title>
<style>
  :root {
    --vc-accent: #6a52c9;
    --vc-accent-text: #b9a9f5;
    --vc-action: #d8b930;
    --vc-bg-base: #17151d;
    --vc-bg-subtle: #201d28;
    --vc-bg-elevated: #2a2633;
    --vc-border-dark: #302b3a;
    --vc-fg: #efedf5;
    --vc-fg-muted: #a7a2b3;
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    user-select: none;
    cursor: default;
  }
  .card {
    box-sizing: border-box;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 14px;
    border: 1px solid var(--vc-border-dark);
    background:
      radial-gradient(circle at 50% 38%, rgba(106, 82, 201, 0.22), transparent 58%),
      linear-gradient(180deg, var(--vc-bg-subtle), var(--vc-bg-base));
    color: var(--vc-fg);
    -webkit-app-region: drag;
    animation: appear 0.35s ease-out;
  }
  .square .card { border-radius: 0; border: 0; }
  /* The Windows installer's picture (electron/installer/render-art.mjs): no text (the installer
     writes its own line), a still bird, the whole ring. */
  .installer-art .text, .installer-art .detail, .installer-art .start-anyway { visibility: hidden; }
  .installer-art .bird, .installer-art .ring svg { animation: none; }
  .ring {
    position: relative;
    width: 136px;
    height: 136px;
    margin-top: 6px;
  }
  .ring svg {
    position: absolute;
    inset: 0;
    transform: rotate(-90deg);
  }
  .track { stroke: var(--vc-bg-elevated); }
  .arc {
    stroke: url(#arc-colour);
    stroke-linecap: round;
    transition: stroke-dashoffset 0.3s ease-out;
  }
  .spin svg { animation: spin 1.1s linear infinite; }
  .bird {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 78px;
    height: 78px;
    margin: -39px 0 0 -39px;
    transform-origin: 50% 70%;
    animation: tilt 3.2s ease-in-out infinite;
  }
  .text {
    margin-top: 26px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  /* Three dots that fill in, after the line (and as much space before it, to stay centred). */
  .text::before {
    content: '';
    display: inline-block;
    width: 1.2em;
  }
  .text::after {
    content: '';
    display: inline-block;
    width: 1.2em;
    text-align: left;
    animation: dots 1.4s steps(4, end) infinite;
  }
  .detail {
    margin-top: 6px;
    min-height: 16px;
    font-size: 12px;
    color: var(--vc-fg-muted);
    font-variant-numeric: tabular-nums;
  }
  .start-anyway {
    margin-top: 14px;
    padding: 4px 8px;
    border: 0;
    border-radius: 4px;
    background: none;
    color: var(--vc-accent-text);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    visibility: hidden;
    opacity: 0;
    transition: opacity 0.3s;
    -webkit-app-region: no-drag;
  }
  .start-anyway.shown { visibility: visible; opacity: 1; }
  .start-anyway:hover { text-decoration: underline; }
  .start-anyway:focus-visible { outline: 2px solid var(--vc-accent); }
  .wordmark {
    position: absolute;
    bottom: 18px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.32em;
    text-indent: 0.32em;
    color: var(--vc-fg-muted);
    opacity: 0.6;
  }
  @keyframes appear { from { opacity: 0; transform: scale(0.97); } }
  @keyframes spin { to { transform: rotate(270deg); } }
  /* The bird cocks its head, listening. */
  @keyframes tilt {
    0%, 100% { transform: rotate(0deg) translateY(0); }
    30% { transform: rotate(-7deg) translateY(-2px); }
    60% { transform: rotate(3deg) translateY(0); }
  }
  @keyframes dots {
    0% { content: ''; }
    25% { content: '.'; }
    50% { content: '..'; }
    75% { content: '...'; }
  }
  @media (prefers-reduced-motion: reduce) {
    .bird, .text::after { animation: none; }
    .spin svg { animation-duration: 3s; }
    .text::after { content: '...'; }
  }
</style>
</head>
<body>
<div class="card">
  <div class="ring spin" id="ring">
    <svg viewBox="0 0 136 136" width="136" height="136" aria-hidden="true">
      <defs>
        <linearGradient id="arc-colour" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#d8b930"/>
          <stop offset="1" stop-color="#6a52c9"/>
        </linearGradient>
      </defs>
      <circle class="track" cx="68" cy="68" r="62" fill="none" stroke-width="5"/>
      <circle class="arc" id="arc" cx="68" cy="68" r="62" fill="none" stroke-width="5"/>
    </svg>
    <img class="bird" src="icon.png" alt="">
  </div>
  <div class="text" id="text" role="status">Starting</div>
  <div class="detail" id="detail"></div>
  <button class="start-anyway" id="start-anyway" type="button">Start anyway</button>
  <div class="wordmark">VOICAW</div>
</div>
<script>
  const params = new URLSearchParams(location.search);
  if (params.has('square')) document.documentElement.classList.add('square');
  if (params.has('installer-art')) document.documentElement.classList.add('installer-art');
  const CIRCUMFERENCE = 2 * Math.PI * 62;
  const ring = document.getElementById('ring');
  const arc = document.getElementById('arc');
  const text = document.getElementById('text');
  const detail = document.getElementById('detail');
  const startAnyway = document.getElementById('start-anyway');
  let view = { ring: 'spin', text: 'Starting', detail: '' };
  let fraction = 0;

  arc.style.strokeDasharray = CIRCUMFERENCE;

  function draw() {
    const progress = view.ring === 'progress';
    ring.classList.toggle('spin', !progress);
    // Spinning: a quarter of the ring goes round. Downloading: it fills.
    arc.style.strokeDashoffset = CIRCUMFERENCE * (progress ? 1 - Math.max(0.02, fraction) : 0.75);
    text.textContent = view.text;
    const percent = progress ? `${Math.round(fraction * 100)}%` : '';
    detail.textContent = [view.detail, percent].filter(Boolean).join(' · ');
  }

  // Called by the window (and by e2e/desktopsplash.mjs, to draw each state).
  window.showView = (next) => {
    view = next;
    if (next.ring !== 'progress') fraction = 0;
    startAnyway.classList.remove('shown');
    draw();
  };
  window.showProgress = (next) => {
    fraction = Math.min(1, Math.max(0, next));
    draw();
  };
  window.offerStart = () => startAnyway.classList.add('shown');

  startAnyway.addEventListener('click', () => window.splash?.startAnyway());
  window.splash?.onView(window.showView);
  window.splash?.onProgress(window.showProgress);
  window.splash?.onOfferStart(window.offerStart);
  draw();
  if (params.has('installer-art')) arc.style.strokeDashoffset = 0;
</script>
</body>
</html>
